# Step 44 - production overlay for a single EC2 host:
#   docker compose -f docker-compose.yml -f docker-compose.full.yml -f docker-compose.prod.yml up -d
#
# Differences from local:
#  - media lives in real AWS S3: no SeaweedFS container, no endpoint override, no static keys
#    (the AWS SDK picks up the EC2 instance role), virtual-hosted style URLs;
#  - images come from the registry (REGISTRY/TAG set by Jenkins), never built on the server;
#  - Nginx serves HTTPS with Let's Encrypt certificates;
#  - nothing but Nginx is published to the internet (Grafana/Prometheus via SSH tunnel);
#  - secrets come from .env, which the host generates from SSM Parameter Store (fetch-secrets.sh).

x-prod-env: &prod-env
  S3_ENDPOINT: ""
  S3_PUBLIC_ENDPOINT: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  S3_PATH_STYLE: "false"
  S3_CREATE_BUCKET: "false"
  MEDIA_BUCKET: ${MEDIA_BUCKET}
  AWS_REGION: ${AWS_REGION}
  WEB_BASE_URL: ${PUBLIC_URL}/app

services:
  s3:
    profiles: ["local-only"]          # disabled in production

  mysql:
    ports: !reset []
  redis:
    ports: !reset []
  kafka:
    ports: !reset []
  elasticsearch:
    ports: !reset []
    environment:
      ES_JAVA_OPTS: "-Xms768m -Xmx768m"
  rabbitmq:
    ports: !reset []
  mailpit:
    profiles: ["local-only"]          # production sends mail through SES/SMTP (SMTP_HOST)

  config-server:   { image: "${REGISTRY}/config-server:${TAG}", build: !reset null }
  eureka-server:   { image: "${REGISTRY}/eureka-server:${TAG}", build: !reset null }
  auth-service:    { image: "${REGISTRY}/auth-service:${TAG}", build: !reset null }
  user-service:    { image: "${REGISTRY}/user-service:${TAG}", build: !reset null }
  media-service:
    image: "${REGISTRY}/media-service:${TAG}"
    build: !reset null
    environment: *prod-env
  video-service:   { image: "${REGISTRY}/video-service:${TAG}", build: !reset null }
  post-service:    { image: "${REGISTRY}/post-service:${TAG}", build: !reset null }
  engagement-service: { image: "${REGISTRY}/engagement-service:${TAG}", build: !reset null }
  feed-service:    { image: "${REGISTRY}/feed-service:${TAG}", build: !reset null }
  search-service:  { image: "${REGISTRY}/search-service:${TAG}", build: !reset null }
  notification-service:
    image: "${REGISTRY}/notification-service:${TAG}"
    build: !reset null
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      WEB_BASE_URL: ${PUBLIC_URL}/app
  moderation-service: { image: "${REGISTRY}/moderation-service:${TAG}", build: !reset null }
  video-worker:
    image: "${REGISTRY}/video-worker:${TAG}"
    build: !reset null
    environment: *prod-env
  api-gateway:     { image: "${REGISTRY}/api-gateway:${TAG}", build: !reset null }

  web:
    image: "${REGISTRY}/web:${TAG}"
    build: !reset null
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./infra/nginx/socialhub-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/socialhub-locations.conf:/etc/nginx/snippets/socialhub-locations.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
