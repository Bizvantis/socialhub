# Step 41 - HTTPS (EC2). Certificates from Let's Encrypt (certbot), see docs/runbooks/aws.md.
# Replace socialhub.example.com with your domain.

upstream gateway {
    server api-gateway:8080;
    keepalive 32;
}

# Redirect all plain HTTP to HTTPS (keep the ACME challenge path for certificate renewal).
server {
    listen 80;
    server_name socialhub.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name socialhub.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/socialhub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socialhub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Browsers must only use HTTPS for this host from now on.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    include /etc/nginx/snippets/socialhub-locations.conf;
}
