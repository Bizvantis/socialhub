# Shared by the HTTP (local) and HTTPS (EC2) server blocks.

# Security headers on every response.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

location = /healthz {
    access_log off;
    return 200 "ok\n";
}

# Landing site (plain HTML/CSS/JS + the Tailwind variant).
location / {
    root /usr/share/nginx/html/landing;
    try_files $uri $uri/ /index.html;
}

# React SPA: unknown paths fall back to index.html so client-side routes work on reload.
location /app/ {
    alias /usr/share/nginx/html/app/;
    try_files $uri $uri/ /app/index.html;
}

# Hashed build assets never change: cache for a year.
location /app/assets/ {
    alias /usr/share/nginx/html/app/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Server-Sent Events: no buffering, long read timeout, keep the connection open.
location /api/notifications/stream {
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

# Everything else under /api goes to the Spring Cloud Gateway (JWT, rate limits, routing).
# Large files never come through here: browsers upload straight to S3 with pre-signed URLs.
location /api/ {
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
}

# Never expose internal APIs, even by accident.
location ~ ^/internal/ {
    return 404;
}
