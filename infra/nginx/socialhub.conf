# Step 41 - Nginx as the single public entry point (HTTP, local full-stack compose).
# On EC2, socialhub-tls.conf is used instead: same locations, plus HTTPS and an HTTP->HTTPS redirect.

upstream gateway {
    server api-gateway:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/snippets/socialhub-locations.conf;
}
