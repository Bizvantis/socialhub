# Alert rules (visible on Prometheus /alerts and in Grafana). In production, wire Alertmanager
# to email/Slack; here the rules document what "unhealthy" means for SocialHub.
groups:
  - name: socialhub
    rules:
      - alert: ServiceDown
        expr: up{job="socialhub-services"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.application }} is down"

      - alert: HighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: more than 5% of requests fail with 5xx"

      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: p95 latency above 1 s"

      - alert: DeadLetterQueueGrowing
        expr: sum by (queue) (rabbitmq_detailed_queue_messages{queue=~".*\\.dlq"}) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Messages parked in {{ $labels.queue }}: investigate failed tasks"

      - alert: JvmHeapPressure
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"}) / sum by (application) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: heap above 90%"
