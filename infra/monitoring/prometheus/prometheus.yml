# Step 42 - Prometheus.
# Services are discovered through Eureka, so a new service (or a second instance of one) is
# scraped automatically without editing this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: socialhub-services
    eureka_sd_configs:
      - server: http://eureka-server:8761/eureka
        refresh_interval: 30s
    relabel_configs:
      # Spring Boot exposes metrics on /actuator/prometheus.
      - target_label: __metrics_path__
        replacement: /actuator/prometheus
      # Readable "application" label = the Eureka app name, lower-cased.
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      - source_labels: [__meta_eureka_app_instance_hostname, __meta_eureka_app_instance_port]
        separator: ":"
        target_label: __address__

  # RabbitMQ's built-in Prometheus plugin (queue depth, DLQ growth).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Per-queue depth (the default endpoint only has totals). Feeds the DLQ alert and panel.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
