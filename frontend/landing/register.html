<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - SocialHub</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card" id="main">
    <a class="brand brand-center" href="index.html">
      <img src="assets/logo.svg" alt="" width="40" height="40"><span>SocialHub</span>
    </a>
    <h1>Create your account</h1>
    <p class="muted">It takes less than a minute.</p>

    <form id="register-form" class="form" novalidate>
      <div class="field">
        <label for="reg-email">Email</label>
        <input id="reg-email" name="email" type="email" autocomplete="email" required>
        <p class="field-error" id="reg-email-error" role="alert"></p>
      </div>
      <div class="field">
        <label for="reg-username">Username</label>
        <input id="reg-username" name="username" type="text" autocomplete="username" required
               pattern="[A-Za-z0-9_]{3,30}" aria-describedby="reg-username-hint">
        <p class="hint" id="reg-username-hint">3-30 letters, digits or underscores.</p>
        <p class="field-error" id="reg-username-error" role="alert"></p>
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <div class="password-wrap">
          <input id="reg-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
          <button type="button" class="toggle-password" aria-label="Show password" data-target="reg-password">Show</button>
        </div>
        <div class="strength" aria-hidden="true"><span id="strength-bar"></span></div>
        <p class="hint" id="strength-label">At least 8 characters.</p>
        <p class="field-error" id="reg-password-error" role="alert"></p>
      </div>
      <div class="field">
        <label for="reg-confirm">Confirm password</label>
        <input id="reg-confirm" name="confirm" type="password" autocomplete="new-password" required>
        <p class="field-error" id="reg-confirm-error" role="alert"></p>
      </div>
      <label class="checkbox">
        <input type="checkbox" id="reg-terms" required>
        <span>I agree to the community guidelines.</span>
      </label>
      <p class="field-error" id="reg-terms-error" role="alert"></p>
      <p class="form-error" id="form-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>

    <p class="muted center">Already have an account? <a href="login.html">Log in</a></p>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
