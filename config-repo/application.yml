# Shared by every service (Spring Cloud Config merges this with <service>.yml).
# Host names come from environment variables so the same files work for
# `java -jar` on the host (defaults: localhost) and inside Docker (Step 40).

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOST:localhost}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publish latency histograms so Prometheus can compute p95/p99 across instances.
      percentiles-histogram:
        http.server.requests: true

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Load lazy collections for up to 50 parents per query (avoids N+1 on lists).
      hibernate.default_batch_fetch_size: 50
      # Store and read every timestamp in UTC (JDBC URLs also pin the session to UTC),
      # so values written by Java and by MySQL defaults agree regardless of server timezone.
      hibernate.jdbc.time_zone: UTC

  # Used only by services that have Kafka on the classpath.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      auto-offset-reset: earliest
      properties:
        # Consumers only see committed records (matters if producers ever use transactions).
        isolation.level: read_committed
    listener:
      ack-mode: record

  # Used only by services that have AMQP on the classpath.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:socialhub}
    password: ${RABBITMQ_PASSWORD:socialhub_dev_mq}
    publisher-confirm-type: simple       # producers wait for the broker's ack (no silent loss)
    listener:
      simple:
        acknowledge-mode: auto           # ack on success, reject on exception
        default-requeue-rejected: false  # rejected -> dead-letter (delayed retry), never a hot loop
        prefetch: 1

app:
  jwt:
    secret: ${JWT_SECRET:dev_only_secret_change_me_dev_only_secret_change_me_1234}
  mysql:
    host: ${MYSQL_HOST:localhost}
  redis:
    host: ${REDIS_HOST:localhost}
