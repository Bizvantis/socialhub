server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${app.mysql.host}:3306/auth_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: auth_user
    password: ${AUTH_DB_PASSWORD:auth_dev_pw}

  flyway:
    enabled: true

  data:
    redis:
      host: ${app.redis.host}
      port: 6379
      password: ${REDIS_PASSWORD:change_me}

  # auth-service keeps its own ApiResponse/GlobalExceptionHandler from Phase 2;
  # it uses only the eventing (outbox, idempotency) and queue parts of the shared library.
  autoconfigure:
    exclude: com.socialhub.common.web.CommonWebAutoConfiguration

app:
  jwt:
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  password-reset:
    ttl: 30m
  web-base-url: ${WEB_BASE_URL:http://localhost:5173}
  # Comma-separated emails that receive the ADMIN role (moderation dashboard).
  bootstrap-admins: ${BOOTSTRAP_ADMINS:}
