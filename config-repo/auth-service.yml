
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${app.mysql.host}:3306/auth_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: auth_user
    password: auth_dev_pw

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:change_me}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    access-ttl-minutes: 15
    refresh-ttl-days: 7
