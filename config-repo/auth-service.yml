
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: auth_user
    password: auth_dev_pw

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:change_me}

app:
  jwt:
    secret: ${JWT_SECRET:dev_only_secret_change_me_dev_only_secret_change_me_1234}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
