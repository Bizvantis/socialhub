server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://${app.mysql.host}:3306/post_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: post_user
    password: ${POST_DB_PASSWORD:post_dev_pw}
  flyway:
    enabled: true
  data:
    redis:
      host: ${app.redis.host}
      port: 6379
      password: ${REDIS_PASSWORD:change_me}
  kafka:
    consumer:
      group-id: post-service

app:
  stories:
    ttl: 24h
