# Step 40 - the whole platform in containers (infra from docker-compose.yml + every service,
# Nginx, Prometheus and Grafana). Only Nginx (80), Grafana (3000) and Prometheus (9090) are
# published: the services are reachable only through the gateway, as in production.
#
#   mvn -f backend/pom.xml package            # build and test the jars once
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build
#   open http://localhost  (landing)  and  http://localhost/app/  (React app)

x-service: &service
  restart: unless-stopped
  mem_limit: 420m
  networks: [default]
  environment: &env
    CONFIG_SERVER_URL: http://config-server:8888
    EUREKA_URL: http://eureka-server:8761/eureka/
    MYSQL_HOST: mysql
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    KAFKA_BOOTSTRAP: kafka:29092
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-socialhub_dev_mq}
    ELASTICSEARCH_URL: http://elasticsearch:9200
    S3_ENDPOINT: http://s3:8333
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
    S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost}
    SMTP_HOST: mailpit
    WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost/app}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    BOOTSTRAP_ADMINS: ${BOOTSTRAP_ADMINS:-}
    FEED_CELEBRITY_THRESHOLD: ${FEED_CELEBRITY_THRESHOLD:-1000}
  depends_on: &deps
    config-server: { condition: service_healthy }
    eureka-server: { condition: service_healthy }
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }

x-build: &build
  context: ./backend
  dockerfile: Dockerfile
  target: service

services:
  config-server:
    image: ${REGISTRY:-socialhub}/config-server:${TAG:-local}
    build: { <<: *build, args: { SERVICE: config-server } }
    restart: unless-stopped
    mem_limit: 300m
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro

  eureka-server:
    image: ${REGISTRY:-socialhub}/eureka-server:${TAG:-local}
    build: { <<: *build, args: { SERVICE: eureka-server } }
    restart: unless-stopped
    mem_limit: 320m
    environment:
      SERVER_PORT: 8761
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server: { condition: service_healthy }

  auth-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/auth-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: auth-service } }
    environment: { <<: *env, SERVER_PORT: 8081, EUREKA_INSTANCE_HOST: auth-service }

  user-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/user-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: user-service } }
    environment: { <<: *env, SERVER_PORT: 8082, EUREKA_INSTANCE_HOST: user-service }

  media-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/media-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: media-service } }
    environment: { <<: *env, SERVER_PORT: 8083, EUREKA_INSTANCE_HOST: media-service }

  video-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/video-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: video-service } }
    environment: { <<: *env, SERVER_PORT: 8084, EUREKA_INSTANCE_HOST: video-service }

  post-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/post-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: post-service } }
    environment: { <<: *env, SERVER_PORT: 8085, EUREKA_INSTANCE_HOST: post-service }

  engagement-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/engagement-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: engagement-service } }
    environment: { <<: *env, SERVER_PORT: 8086, EUREKA_INSTANCE_HOST: engagement-service }

  feed-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/feed-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: feed-service } }
    environment: { <<: *env, SERVER_PORT: 8087, EUREKA_INSTANCE_HOST: feed-service }

  search-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/search-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: search-service } }
    environment: { <<: *env, SERVER_PORT: 8088, EUREKA_INSTANCE_HOST: search-service }
    depends_on:
      <<: *deps
      elasticsearch: { condition: service_healthy }

  notification-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/notification-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: notification-service } }
    environment: { <<: *env, SERVER_PORT: 8089, EUREKA_INSTANCE_HOST: notification-service }
    depends_on:
      <<: *deps
      rabbitmq: { condition: service_healthy }

  moderation-service:
    <<: *service
    image: ${REGISTRY:-socialhub}/moderation-service:${TAG:-local}
    build: { <<: *build, args: { SERVICE: moderation-service } }
    environment: { <<: *env, SERVER_PORT: 8090, EUREKA_INSTANCE_HOST: moderation-service }

  video-worker:
    <<: *service
    image: ${REGISTRY:-socialhub}/video-worker:${TAG:-local}
    build: { <<: *build, target: worker, args: { SERVICE: video-worker } }
    mem_limit: 700m   # ffmpeg runs inside this container
    environment: { <<: *env, SERVER_PORT: 8091, EUREKA_INSTANCE_HOST: video-worker }
    depends_on:
      <<: *deps
      rabbitmq: { condition: service_healthy }

  api-gateway:
    <<: *service
    image: ${REGISTRY:-socialhub}/api-gateway:${TAG:-local}
    build: { <<: *build, args: { SERVICE: api-gateway } }
    environment: { <<: *env, SERVER_PORT: 8080, EUREKA_INSTANCE_HOST: api-gateway }

  web:
    image: ${REGISTRY:-socialhub}/web:${TAG:-local}
    build: { context: ./frontend, dockerfile: Dockerfile }
    container_name: socialhub-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/socialhub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/socialhub-locations.conf:/etc/nginx/snippets/socialhub-locations.conf:ro
    depends_on:
      api-gateway: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: socialhub-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      eureka-server: { condition: service_healthy }

  grafana:
    image: grafana/grafana:11.4.0
    container_name: socialhub-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-socialhub_dev_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  prometheus_data:
  grafana_data:
